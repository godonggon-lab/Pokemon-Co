name: Judge Docker Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  docker-runner-verdicts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Build coderunner image
        run: docker build -t dongjun-coderunner:latest judge

      - name: Check Docker runner verdicts
        run: npm run judge:docker-check

  verify-overrides:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Build coderunner image
        run: docker build -t dongjun-coderunner:latest judge

      - name: Verify judge overrides shard ${{ matrix.shard }}/8
        run: python scripts/verify-judge-overrides.py --shard ${{ matrix.shard }}/8
